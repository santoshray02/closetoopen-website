<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" fill="none">
  <defs>
    <linearGradient id="cGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="500" height="320" rx="24" fill="url(#cardBg)" stroke="#334155" stroke-width="2" />
  
  <!-- Grid Lines -->
  <line x1="50" y1="250" x2="450" y2="250" stroke="#334155" stroke-dasharray="4 4" />
  <line x1="50" y1="190" x2="450" y2="190" stroke="#334155" stroke-dasharray="4 4" />
  <line x1="50" y1="130" x2="450" y2="130" stroke="#334155" stroke-dasharray="4 4" />
  <line x1="50" y1="70" x2="450" y2="70" stroke="#334155" stroke-dasharray="4 4" />

  <!-- Growth Curve Line -->
  <path d="M 60 250 C 160 240, 220 180, 280 120 C 340 60, 400 50, 440 45" stroke="url(#cGrad)" stroke-width="6" stroke-linecap="round" fill="none" filter="url(#glow)" />

  <!-- Milestone Nodes -->
  <!-- Node 1: Entry/Manager -->
  <circle cx="100" cy="245" r="10" fill="#3B82F6" />
  <rect x="70" y="265" width="80" height="28" rx="8" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5" />
  <text x="110" y="283" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#93C5FD" text-anchor="middle">1. Manager</text>

  <!-- Node 2: Mentorship Pivot -->
  <circle cx="260" cy="140" r="12" fill="#8B5CF6" />
  <rect x="210" y="160" width="100" height="28" rx="8" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.5" />
  <text x="260" y="178" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#C4B5FD" text-anchor="middle">2. CloseToOpen Pivot</text>

  <!-- Node 3: Executive VP -->
  <circle cx="440" cy="45" r="14" fill="#EC4899" filter="url(#glow)" />
  <rect x="360" y="70" width="120" height="34" rx="8" fill="#0F172A" stroke="#EC4899" stroke-width="2" />
  <text x="420" y="91" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#F472B6" text-anchor="middle">3. VP / C-Suite (+45%)</text>
</svg>
