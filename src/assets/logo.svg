<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <defs>
    <!-- 2026 Hyper-Gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="portalGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Mark: The CloseToOpen Portal Aperture -->
  <g transform="translate(10, 10)">
    <!-- Outer Closing Arc 'C' -->
    <path d="M 32 8 C 18 8, 8 18, 8 30 C 8 42, 18 52, 32 52" stroke="url(#logoGrad)" stroke-width="6" stroke-linecap="round" fill="none" filter="url(#logoGlow)" />
    
    <!-- Inner Opening Door / Portal Arrow 'O' -->
    <path d="M 22 30 C 22 22, 28 16, 36 16 C 44 16, 50 22, 50 30 C 50 38, 44 44, 36 44" stroke="url(#portalGrad)" stroke-width="5" stroke-linecap="round" stroke-dasharray="32 10" fill="none" />
    
    <!-- Growth Vector Pulse -->
    <circle cx="36" cy="30" r="4" fill="#38BDF8" filter="url(#logoGlow)" />
    <path d="M 36 30 L 46 20 M 46 20 L 40 20 M 46 20 L 46 26" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Wordmark Text -->
  <text x="72" y="38" font-family="'Outfit', 'Inter', sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">Close<tspan fill="url(#logoGrad)">ToOpen</tspan></text>
</svg>
